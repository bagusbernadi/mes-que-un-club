.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}.kpis.k5{grid-template-columns:repeat(5,minmax(0,1fr))}.kpi{background:#f8fafc;border-radius:10px;padding:12px 14px}
.kpi div{font-size:12px;color:#64748b}.kpi b+div{margin-top:4px}.kpi b{font-size:20px;font-weight:600}tr.wk1>td{border-top:2px solid #cbd5e1}.plhint{font-size:12px;color:#64748b;margin-top:6px}.kpi.worst{background:#fff7f7;box-shadow:inset 0 0 0 1px #fca5a5}.wtag{display:block;margin-top:3px;font-size:11px;font-weight:600;color:#B91C1C}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.35);display:flex;align-items:center;justify-content:center;z-index:9}.modal>div{background:#fff;border-radius:14px;padding:20px 22px;max-width:420px;box-shadow:0 20px 40px rgba(0,0,0,.15)}
/* ===== Excel-style report ===== */
.xlwrap{overflow:auto;border:1px solid #bfbfbf;max-height:calc(100vh - 170px)}
table.xl{border-collapse:collapse;font:12px Calibri,Carlito,Arial,sans-serif;color:#000}
table.xl td,table.xl th{border:1px solid #bfbfbf;padding:2px 5px;height:20px;white-space:nowrap;text-align:center}
table.xl .title{background:#1F3864;color:#fff;font-weight:bold;font-size:15px;height:34px;text-align:center;position:sticky;left:0}
table.xl .legend{background:#DEEAF1;color:#1F3864;font-size:11px;text-align:left}
table.xl thead th{background:#1F3864;color:#fff;font-weight:bold;font-size:11px;position:sticky;z-index:2}
table.xl thead tr.h1 th{top:0;height:34px}table.xl thead tr.h2 th{top:38px}
table.xl th.day{background:#2F5597;font-size:10px;min-width:44px;line-height:1.15}table.xl th.we{background:#7F7F7F}
table.xl th.ok{background:#4472C4;font-size:10px}table.xl th.ng{background:#C00000;font-size:10px}
table.xl th.sumh{background:#375623}table.xl th.days{background:#1F7391}
table.xl td{background:#EBF5FB}table.xl td.stn{background:#D6DCE4;color:#1F3864;font-weight:bold;white-space:normal;min-width:110px;max-width:130px}
table.xl td.nm{font-weight:bold;min-width:105px}table.xl td.tg{color:#1F3864;font-weight:bold}table.xl td.avg{color:#2E75B6;font-weight:bold}
table.xl td.ty{color:#1F3864}table.xl tr.spl td.ty{background:#C6EFCE}
table.xl td.v{font-weight:bold;min-width:24px}table.xl td.vn{color:#C00000;min-width:18px}table.xl td.we{background:#F2F2F2}
table.xl td.s{color:#375623;font-weight:bold}table.xl td.d{color:#1F7391}
table.xl tr.bk td{border-top:2px solid #7f7f7f}
table.xl tr.t1 td{background:#FFC000;font-weight:bold;font-size:11px}table.xl tr.t2 td{background:#E2EFDA;color:#1F3864;font-size:11px}
table.xl tr.t3 td{background:#F2F2F2;color:#1F3864;font-size:11px}table.xl tr.t4 td{background:#FCE4D6;color:#1F3864;font-size:11px}
table.xl td.lbl{text-align:left;font-weight:bold}table.xl tr.gap td{background:#fff;border-left:0;border-right:0;height:10px}
.tabs{display:flex;gap:2px;border-top:1px solid #bfbfbf;background:#f3f3f3;padding:0 6px;font:12px Calibri,Arial,sans-serif;flex-wrap:wrap}
.tabs a{padding:5px 14px;cursor:pointer;color:#333;border:1px solid transparent;border-top:0}.tabs a.on{background:#fff;border-color:#bfbfbf;color:#1F7346;font-weight:bold;border-bottom:2px solid #1F7346}
/* title bars */
.xlt{background:#1F3864;color:#fff;font:bold 15px Calibri,Carlito,Arial,sans-serif;text-align:center;padding:8px;border:1px solid #bfbfbf;border-bottom:0}
.xll{background:#DEEAF1;color:#1F3864;font:11px Calibri,Carlito,Arial,sans-serif;padding:4px 6px;border:1px solid #bfbfbf;border-bottom:0}
/* rekap */
table.rk{border-collapse:collapse;font:12px Arial,sans-serif;color:#000}table.rk td,table.rk th{border:1px solid #bfbfbf;padding:3px 6px;height:20px;white-space:nowrap}
table.rk thead th{background:#1F3864;color:#fff;font-weight:bold;font-size:11px;text-align:center;position:sticky;z-index:2}
table.rk thead tr.h1 th{top:0;height:32px}table.rk thead tr.h2 th{top:37px}
table.rk th.pr{background:#4472C4}table.rk th.blue{background:#2E75B6}table.rk th.gr{background:#375623}table.rk th.tl{background:#1F7391}
table.rk td{text-align:center}table.rk td.l{text-align:left}table.rk td.num{text-align:center;font-variant-numeric:tabular-nums}
table.rk tr.z0 td{background:#fff}table.rk tr.z1 td{background:#F3F7FB}table.rk tr.rs td{background:#D9D9D9;color:#7F7F7F}
table.rk td.tot{color:#375623;font-weight:bold}table.rk td.dy{color:#1F7391}table.rk td.av{color:#2E75B6;font-weight:bold}
table.rk td.kb{background:#FFF2CC!important;color:#7F6000;font-weight:bold}table.rk td.kl{background:#DDEBF7!important;color:#1F3864;font-weight:bold}
table.rk tr.sb td{background:#FFF2CC;color:#7F6000;font-weight:bold}table.rk tr.sl td{background:#DDEBF7;color:#1F3864;font-weight:bold}table.rk tr.st td{background:#1F3864;color:#fff;font-weight:bold}
table.rk .title{background:#1F3864;color:#fff;font-weight:bold;font-size:15px;height:32px}table.rk .legend{background:#DEEAF1;color:#1F3864;font-style:italic;font-size:11px;text-align:left}

   audit('koreksi',`#${k.id} ${k.tgl} ${k.sh} ${opById[c.op].nama} ${c.p}: OK ${c.o[0]}→${c.n[0]}, NG ${c.o[1]}→${c.n[1]}`)});k.status='approved';msg('ok','Koreksi disetujui dan diterapkan.')}
  else{k.status='rejected';audit('tolak_koreksi','#'+k.id);msg('ok','Request koreksi ditolak.')}return render()}
 const a=d.act;
 if(a==='addop'){const s=addop.value;if(!s)return;V.extra=[...(V.extra||[]),s];return renderKeep()}
 if(a==='draft')return saveInput(false);
 if(a==='nop')return confirmBox(`Tandai ${stById[V.st].nama} tidak ada produksi pada shift ${V.sh} ${V.tgl}? Angka yang sudah diisi di station ini akan dihapus.`,()=>saveInput(true,true));
 if(a==='submit')return confirmBox(`Submit ${stById[V.st].nama} untuk shift ${V.sh} ${V.tgl}? Setelah submit, data station ini tidak bisa diubah Asisten Leader.`,()=>saveInput(true));
 if(a==='tokor')return go({view:'korform',tgl:V.tgl,sh:V.sh,st:V.st,extra:[]});if(a==='sendkor')return sendKor();
 if(a==='approveall'){const c=grpStat(V.gt,V.gs,V.gg);c.list.forEach(([st,x])=>{if(x&&x.status==='submitted'){x.status='locked';x.auto=0;x.lock_at=tstr(now());audit('verifikasi',`${x.tgl} ${x.sh} ${st.nama} disetujui & dikunci`)}});msg('ok',`${c.submitted} station disetujui dan dikunci.`);return render()}});
document.addEventListener('click',e=>{const pop=document.getElementById('calpop');if(!pop)return;
 if(e.target.closest('[data-cal]')){e.stopPropagation();if(!pop.hidden){pop.hidden=true;return}const key=e.target.closest('[data-cal]').dataset.cal;const d=new Date((V[key]||dstr(now()))+'T00:00');return calDraw([d.getFullYear(),d.getMonth()],key)}
 const n=e.target.closest('[data-cnav]');if(n){e.stopPropagation();let[y,m]=pop.dataset.ym.split('-').map(Number);m+=+n.dataset.cnav;if(m<0){m=11;y--}if(m>11){m=0;y++}return calDraw([y,m])}
 const c=e.target.closest('[data-cday]');if(c){e.stopPropagation();V[pop.dataset.key]=c.dataset.cday;V.extra=[];return render()}
 if(!e.target.closest('#calpop'))pop.hidden=true},true);
document.addEventListener('change',e=>{const id=e.target.id;if(e.target.dataset.key&&e.target.value){V[e.target.dataset.key]=e.target.value;V.extra=[];render()}if(id==='rmon'){V.m=e.target.value;render()}if(id==='hide0'){V.hide0=e.target.checked;render()}if(id==='fk'){V.fk=e.target.value;render()}if(['tm','tg','pm','pst','pk','pte','rs','om','wm','ww','yf'].includes(id)){V[id]=e.target.value;render()}});
let qt;document.addEventListener('input',e=>{if(e.target.closest('#gb'))return recalc();if(e.target.id==='q'||e.target.id==='q2'){const id=e.target.id,v=e.target.value,pos=e.target.selectionStart;clearTimeout(qt);qt=setTimeout(()=>{V[id]=v;render();const el=document.getElementById(id);el.focus();el.setSelectionRange(pos,pos)},250)}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||!e.target.closest('#gb'))return;e.preventDefault();const tr=e.target.closest('tr'),idx=[...tr.querySelectorAll('input')].indexOf(e.target);let n=tr.nextElementSibling;
 while(n&&!n.querySelector('input'))n=n.nextElementSibling;(n?n.querySelectorAll('input')[idx]:tr.parentElement.querySelector('tr input'))?.focus()});
document.addEventListener('paste',e=>{const t=e.target;if(!t.closest||!t.closest('#gb'))return;const txt=e.clipboardData.getData('text');if(!/[\t\n]/.test(txt.trim()))return;e.preventDefault();
 const rows=[...document.querySelectorAll('#gb tr[data-op]')];let ri=rows.indexOf(t.closest('tr'));const ci=[...rows[ri].querySelectorAll('input')].indexOf(t);
 txt.replace(/\r/g,'').replace(/\n$/,'').split('\n').forEach((line,k)=>{const r=rows[ri+k];if(!r)return;const ins=r.querySelectorAll('input');line.split('\t').forEach((v,j)=>{if(ins[ci+j])ins[ci+j].value=v.trim()})});recalc()});
who.innerHTML=USERS.map(u=>`<option value="${u.u}">${u.nama}</option>`).join('');who.onchange=()=>{S.user=who.value;V={view:'status'};render()};
clock.onchange=e=>{if(e.target.value){S.now=e.target.value;render()}};
const shiftClock=h=>{const d=now();d.setHours(d.getHours()+h);S.now=dstr(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes());render()};
plus1.onclick=()=>shiftClock(1);plus3.onclick=()=>shiftClock(3);
reset.onclick=()=>confirmBox('Hapus semua perubahan demo dan kembali ke data awal?',()=>{S=seed();V={view:'status'};render()});
const navSet=c=>{document.body.classList.toggle('navc',c);const b=document.getElementById('navtog');b.title=c?'Tampilkan menu':'Sembunyikan menu';b.setAttribute('aria-label',b.title);b.setAttribute('aria-expanded',String(!c));try{localStorage.setItem('mesnav',c?'1':'0')}catch(e){}};
navtog.onclick=()=>navSet(!document.body.classList.contains('navc'));try{navSet(localStorage.getItem('mesnav')==='1')}catch(e){navSet(false)}
S=load();render();
